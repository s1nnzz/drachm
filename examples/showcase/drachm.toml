[project]
name = "showcase"
kind = "program"

[dependencies]
charts = { path = "charts" }

[behaviour]
missing_key = "panic"
unhandled_fail = "crash"
import_clash = "error"

[native]
include = ["c"]
sources = ["c/harbour.c"]
unsafe = true   # the project may call C and use raw pointers (no file flag)
